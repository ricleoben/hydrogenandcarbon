name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check content references
        run: npm run check:content

      # `next build` runs the TypeScript compiler, so a separate typecheck step
      # would only duplicate it (and trips over stale .next/types when run first).
      - name: Build
        run: npm run build
